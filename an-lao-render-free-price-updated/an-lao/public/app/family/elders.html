<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hồ sơ sức khoẻ — An Lão</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .elder-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px;}
  .elder-pill{
    display:flex; align-items:center; gap:10px; padding:9px 16px 9px 9px;
    border:1.5px solid var(--line); border-radius:40px; background:var(--paper); cursor:pointer;
    font-size:14.5px; font-weight:500;
  }
  .elder-pill.on{border-color:var(--blue); background:var(--blue-soft); color:var(--blue-deep);}
  .tag-list{display:flex; flex-wrap:wrap; gap:8px;}
  .tag-item{
    display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:20px;
    background:var(--blue-soft); color:var(--blue-deep); font-size:13.5px;
  }
  .tag-item.warn{background:var(--danger-soft); color:var(--danger);}
  .tag-item button{background:none; border:none; cursor:pointer; color:inherit; font-size:15px; line-height:1; padding:0; opacity:.6;}
  .tag-item button:hover{opacity:1;}
  .med{display:grid; grid-template-columns:1fr auto; gap:14px; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .med:last-child{border-bottom:none;}
  .med .nm{font-weight:600; font-size:15px;}
  .med .ds{font-size:13.5px; color:var(--ink-soft); margin-top:3px;}
  .med .tm{font-family:'Fraunces', serif; font-size:17px; color:var(--blue-deep);}
  .rem{display:grid; grid-template-columns:70px 1fr auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--line-soft);}
  .rem:last-child{border-bottom:none;}
  .rem .tm{font-family:'Fraunces', serif; font-size:19px; color:var(--blue-deep);}
  .rem.off{opacity:.45;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Hồ sơ sức khoẻ</h1>
        <div class="sub">Bệnh lý, đơn thuốc, dị ứng và lịch tái khám của người thân</div>
      </div>
      <button class="btn btn-primary btn-sm" id="addElderBtn">Thêm người thân</button>
    </div>

    <div class="content">
      <div class="elder-tabs" id="elderTabs"></div>
      <div id="detail"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
Auth.guard('family');
mountNav('elders');

let elders = [];
let current = null;   // elder đang xem
let record = null;    // hồ sơ sức khoẻ của elder đó

const params = new URLSearchParams(location.search);

/* ===================== TẢI DỮ LIỆU ===================== */

async function loadElders() {
  elders = await api.get('/elders');
  if (!elders.length) {
    document.getElementById('elderTabs').innerHTML = '';
    document.getElementById('detail').innerHTML = `
      <div class="empty"><strong>Chưa có hồ sơ người thân</strong>
        Thêm hồ sơ để lưu bệnh lý, đơn thuốc và đặt ca chăm sóc.
        <div style="margin-top:18px"><button class="btn btn-primary btn-sm" onclick="openElderForm()">Thêm người thân</button></div>
      </div>`;
    return;
  }
  const wanted = Number(params.get('id')) || current?.id || elders[0].id;
  renderTabs(wanted);
  await selectElder(wanted);
}

function renderTabs(activeId) {
  document.getElementById('elderTabs').innerHTML = elders.map(e => `
    <div class="elder-pill ${e.id === activeId ? 'on' : ''}" onclick="selectElder(${e.id})">
      ${avatar(e.full_name, '#E2A045', 'avatar-sm')}
      <span>${esc(e.full_name)}</span>
    </div>`).join('');
}

async function selectElder(id) {
  current = elders.find(e => e.id === id);
  renderTabs(id);
  document.getElementById('detail').innerHTML = '<div class="muted">Đang tải hồ sơ…</div>';
  const [rec, vitals, reminders] = await Promise.all([
    api.get(`/elders/${id}/health`),
    api.get(`/elders/${id}/vitals?limit=10`),
    api.get(`/elders/${id}/reminders`)
  ]);
  record = rec;
  renderDetail(vitals, reminders);
}

/* ===================== HIỂN THỊ ===================== */

function renderDetail(vitals, reminders) {
  const age = current.birth_year ? new Date().getFullYear() - current.birth_year : null;

  document.getElementById('detail').innerHTML = `
    <div class="stack">
      <!-- Thông tin chung -->
      <div class="card">
        <div class="card-head">
          <div class="row">
            ${avatar(current.full_name, '#E2A045', 'avatar-lg')}
            <div>
              <h3>${esc(current.full_name)}</h3>
              <div class="muted" style="font-size:14.5px">
                ${age ? age + ' tuổi' : ''}${current.gender ? ' · ' + ({nam:'Nam',nu:'Nữ',khac:'Khác'}[current.gender]) : ''}
                ${current.relation ? ' · ' + esc(current.relation) : ''}
                ${record.blood_type ? ' · Nhóm máu ' + esc(record.blood_type) : ''}
              </div>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-ghost btn-sm" onclick="openElderForm(current)">Sửa thông tin</button>
            <a href="/app/family/booking.html?new=1&elder=${current.id}" class="btn btn-primary btn-sm">Đặt ca</a>
          </div>
        </div>
        <div class="grid-2">
          <div><div class="faint">Địa chỉ chăm sóc</div>
            <div style="margin-top:4px">${esc(current.address) || 'Chưa cập nhật'}</div></div>
          <div><div class="faint">Lịch tái khám tiếp theo</div>
            <div style="margin-top:4px">${record.next_checkup ? fmtDate(record.next_checkup) : 'Chưa đặt lịch'}</div></div>
        </div>
      </div>

      <div class="grid-2">
        <!-- Bệnh lý -->
        <div class="card">
          <div class="card-head"><h3>Bệnh lý nền</h3>
            <button class="btn btn-ghost btn-sm" onclick="addTag('conditions')">Thêm</button></div>
          <div class="tag-list" id="conditionsBox"></div>
        </div>
        <!-- Dị ứng -->
        <div class="card">
          <div class="card-head"><h3>Dị ứng và kiêng kỵ</h3>
            <button class="btn btn-ghost btn-sm" onclick="addTag('allergies')">Thêm</button></div>
          <div class="tag-list" id="allergiesBox"></div>
        </div>
      </div>

      <!-- Đơn thuốc -->
      <div class="card">
        <div class="card-head"><h3>Đơn thuốc đang dùng</h3>
          <button class="btn btn-ghost btn-sm" onclick="addMedication()">Thêm thuốc</button></div>
        <div id="medBox"></div>
        <div class="faint" style="margin-top:14px">
          Mỗi loại thuốc sẽ tự động thành một đầu việc trong nhật ký của chăm sóc viên khi bạn đặt ca mới.
        </div>
      </div>

      <div class="grid-2">
        <!-- Thói quen -->
        <div class="card">
          <div class="card-head"><h3>Thói quen và khả năng vận động</h3>
            <button class="btn btn-ghost btn-sm" onclick="openNotesForm()">Sửa</button></div>
          <div class="stack-sm">
            <div><div class="faint">Thói quen sinh hoạt</div>
              <div style="margin-top:3px">${esc(record.habits) || 'Chưa cập nhật'}</div></div>
            <div><div class="faint">Khả năng vận động</div>
              <div style="margin-top:3px">${esc(record.mobility) || 'Chưa cập nhật'}</div></div>
            <div><div class="faint">Lưu ý khi chăm sóc</div>
              <div style="margin-top:3px">${esc(record.care_notes) || 'Chưa cập nhật'}</div></div>
          </div>
        </div>

        <!-- Nhắc nhở -->
        <div class="card">
          <div class="card-head"><h3>Nhắc nhở hằng ngày</h3>
            <button class="btn btn-ghost btn-sm" onclick="addReminder()">Thêm</button></div>
          <div id="remBox">${reminders.length ? reminders.map(r => `
            <div class="rem ${r.active ? '' : 'off'}">
              <div class="tm">${esc(r.time_of_day)}</div>
              <div>
                <div style="font-weight:500">${esc(r.title)}</div>
                <div class="faint">${esc(r.detail) || ({medicine:'Uống thuốc',exercise:'Vận động',checkup:'Tái khám',water:'Uống nước',other:'Khác'}[r.type])}</div>
              </div>
              <div class="row" style="gap:6px">
                <button class="btn btn-ghost btn-sm" onclick="toggleReminder(${r.id}, ${r.active ? 0 : 1})">${r.active ? 'Tắt' : 'Bật'}</button>
                <button class="btn btn-danger btn-sm" onclick="delReminder(${r.id})">Xoá</button>
              </div>
            </div>`).join('') :
            '<div class="faint">Chưa có nhắc nhở nào. Nhắc nhở sẽ hiện trên màn hình của người cao tuổi.</div>'}
          </div>
        </div>
      </div>

      <!-- Chỉ số -->
      <div class="card">
        <div class="card-head"><h3>Lịch sử chỉ số sinh tồn</h3>
          <button class="btn btn-ghost btn-sm" onclick="addVital()">Ghi nhận chỉ số</button></div>
        ${vitals.length ? `<table>
          <tr><th>Thời gian</th><th>Huyết áp</th><th>Nhịp tim</th><th>Nhiệt độ</th><th>Đường huyết</th><th>Giấc ngủ</th><th>Ghi chú</th></tr>
          ${vitals.map(v => `<tr>
            <td class="muted">${fmtRelative(v.recorded_at)}</td>
            <td class="mono-num">${v.systolic && v.diastolic ? `${v.systolic}/${v.diastolic}` : '—'}</td>
            <td class="mono-num">${v.heart_rate || '—'}</td>
            <td class="mono-num">${v.temperature ? v.temperature + '°C' : '—'}</td>
            <td class="mono-num">${v.glucose || '—'}</td>
            <td class="mono-num">${v.sleep_hours ? v.sleep_hours + ' giờ' : '—'}</td>
            <td class="muted">${esc(v.note) || '—'}</td>
          </tr>`).join('')}
        </table>` : '<div class="faint">Chưa có số liệu nào được ghi nhận.</div>'}
      </div>
    </div>`;

  paintTags('conditions', 'conditionsBox');
  paintTags('allergies', 'allergiesBox', true);
  paintMeds();
}

function paintTags(field, boxId, warn = false) {
  const items = record[field] || [];
  document.getElementById(boxId).innerHTML = items.length ? items.map((t, i) => `
    <span class="tag-item ${warn ? 'warn' : ''}">${esc(t)}
      <button onclick="removeTag('${field}', ${i})" title="Xoá">×</button></span>`).join('')
    : '<span class="faint">Chưa có thông tin nào.</span>';
}

function paintMeds() {
  const meds = record.medications || [];
  document.getElementById('medBox').innerHTML = meds.length ? meds.map((m, i) => `
    <div class="med">
      <div>
        <div class="nm">${esc(m.name)}</div>
        <div class="ds">${esc(m.dose) || ''}${m.note ? ' · ' + esc(m.note) : ''}</div>
      </div>
      <div class="row">
        <div class="tm">${esc(m.time) || '—'}</div>
        <button class="btn btn-danger btn-sm" onclick="removeMed(${i})">Xoá</button>
      </div>
    </div>`).join('') : '<div class="faint">Chưa có thuốc nào trong đơn.</div>';
}

/* ===================== CẬP NHẬT ===================== */

async function saveRecord(patch) {
  record = await api.put(`/elders/${current.id}/health`, patch);
  await selectElder(current.id);
  toast('Đã lưu hồ sơ');
}

function addTag(field) {
  const label = field === 'conditions' ? 'bệnh lý nền' : 'dị ứng hoặc kiêng kỵ';
  const m = openModal(`
    <h3>Thêm ${label}</h3>
    <p class="modal-sub">Thông tin này giúp chăm sóc viên tránh sai sót khi chăm sóc.</p>
    <div class="field"><label>Nội dung</label>
      <input type="text" id="tagVal" placeholder="${field === 'conditions' ? 'Ví dụ: Tăng huyết áp' : 'Ví dụ: Dị ứng penicillin'}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Thêm</button>
    </div>`);
  m.querySelector('#tagVal').focus();
  m.querySelector('#ok').onclick = async () => {
    const v = m.querySelector('#tagVal').value.trim();
    if (!v) return;
    m.close();
    await saveRecord({ [field]: [...(record[field] || []), v] });
  };
}

async function removeTag(field, index) {
  const next = (record[field] || []).filter((_, i) => i !== index);
  await saveRecord({ [field]: next });
}

function addMedication() {
  const m = openModal(`
    <h3>Thêm thuốc vào đơn</h3>
    <p class="modal-sub">Thuốc sẽ tự động thành đầu việc nhắc uống trong ca chăm sóc.</p>
    <div class="field"><label>Tên thuốc</label><input type="text" id="mName" placeholder="Amlodipin 5mg"></div>
    <div class="field-row">
      <div class="field"><label>Liều dùng</label><input type="text" id="mDose" placeholder="1 viên"></div>
      <div class="field"><label>Giờ uống</label><input type="time" id="mTime" value="08:00"></div>
    </div>
    <div class="field"><label>Ghi chú</label><input type="text" id="mNote" placeholder="Uống sau ăn sáng"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Thêm thuốc</button>
    </div>`);
  m.querySelector('#ok').onclick = async () => {
    const name = m.querySelector('#mName').value.trim();
    if (!name) return toast('Cần nhập tên thuốc');
    const med = {
      name,
      dose: m.querySelector('#mDose').value.trim(),
      time: m.querySelector('#mTime').value,
      note: m.querySelector('#mNote').value.trim()
    };
    m.close();
    await saveRecord({ medications: [...(record.medications || []), med] });
  };
}

async function removeMed(index) {
  await saveRecord({ medications: (record.medications || []).filter((_, i) => i !== index) });
}

function openNotesForm() {
  const m = openModal(`
    <h3>Thói quen và lưu ý chăm sóc</h3>
    <p class="modal-sub">Càng chi tiết, chăm sóc viên càng dễ giữ đúng nếp sinh hoạt quen thuộc.</p>
    <div class="field"><label>Thói quen sinh hoạt</label>
      <textarea id="habits" placeholder="Giờ dậy, giờ ăn, giờ ngủ trưa, sở thích…">${esc(record.habits) || ''}</textarea></div>
    <div class="field"><label>Khả năng vận động</label>
      <textarea id="mobility" placeholder="Tự đi lại được không, có cần gậy hay xe lăn…">${esc(record.mobility) || ''}</textarea></div>
    <div class="field"><label>Lưu ý khi chăm sóc</label>
      <textarea id="care_notes" placeholder="Những điều chăm sóc viên cần đặc biệt chú ý">${esc(record.care_notes) || ''}</textarea></div>
    <div class="field"><label>Ngày tái khám tiếp theo</label>
      <input type="date" id="next_checkup" value="${record.next_checkup || ''}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Lưu</button>
    </div>`);
  m.querySelector('#ok').onclick = async () => {
    const patch = {
      habits: m.querySelector('#habits').value.trim(),
      mobility: m.querySelector('#mobility').value.trim(),
      care_notes: m.querySelector('#care_notes').value.trim(),
      next_checkup: m.querySelector('#next_checkup').value || null
    };
    m.close();
    await saveRecord(patch);
  };
}

function addVital() {
  const m = openModal(`
    <h3>Ghi nhận chỉ số</h3>
    <p class="modal-sub">Dành cho lúc bạn tự đo tại nhà ngoài ca chăm sóc.</p>
    <div class="field-row">
      <div class="field"><label>Huyết áp tâm thu</label><input type="number" id="sys" placeholder="130"></div>
      <div class="field"><label>Huyết áp tâm trương</label><input type="number" id="dia" placeholder="80"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Nhịp tim (lần/phút)</label><input type="number" id="hr" placeholder="75"></div>
      <div class="field"><label>Nhiệt độ (°C)</label><input type="number" step="0.1" id="temp" placeholder="36.5"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Đường huyết (mmol/L)</label><input type="number" step="0.1" id="glu" placeholder="5.6"></div>
      <div class="field"><label>Giấc ngủ (giờ)</label><input type="number" step="0.5" id="sleep" placeholder="7"></div>
    </div>
    <div class="field"><label>Ghi chú</label><input type="text" id="vnote" placeholder="Tình trạng lúc đo"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Lưu chỉ số</button>
    </div>`);
  m.querySelector('#ok').onclick = async () => {
    const num = (id) => { const v = m.querySelector('#' + id).value; return v ? Number(v) : null; };
    const body = {
      systolic: num('sys'), diastolic: num('dia'), heart_rate: num('hr'),
      temperature: num('temp'), glucose: num('glu'), sleep_hours: num('sleep'),
      note: m.querySelector('#vnote').value.trim() || null
    };
    if (!Object.values(body).some(v => v !== null)) return toast('Nhập ít nhất một chỉ số');
    m.close();
    await api.post(`/elders/${current.id}/vitals`, body);
    await selectElder(current.id);
    toast('Đã ghi nhận chỉ số');
  };
}

function addReminder() {
  const m = openModal(`
    <h3>Thêm nhắc nhở</h3>
    <p class="modal-sub">Nhắc nhở hiện trên màn hình đơn giản của người cao tuổi kèm đọc bằng giọng nói.</p>
    <div class="field"><label>Loại nhắc nhở</label>
      <select id="rType">
        <option value="medicine">Uống thuốc</option>
        <option value="exercise">Tập vận động</option>
        <option value="water">Uống nước</option>
        <option value="checkup">Tái khám</option>
        <option value="other">Khác</option>
      </select></div>
    <div class="field"><label>Nội dung</label><input type="text" id="rTitle" placeholder="Uống thuốc huyết áp"></div>
    <div class="field"><label>Chi tiết</label><input type="text" id="rDetail" placeholder="Amlodipin 5mg, uống sau ăn sáng"></div>
    <div class="field"><label>Giờ nhắc</label><input type="time" id="rTime" value="08:00"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Thêm nhắc nhở</button>
    </div>`);
  m.querySelector('#ok').onclick = async () => {
    const title = m.querySelector('#rTitle').value.trim();
    if (!title) return toast('Cần nhập nội dung nhắc nhở');
    m.close();
    await api.post(`/elders/${current.id}/reminders`, {
      type: m.querySelector('#rType').value,
      title,
      detail: m.querySelector('#rDetail').value.trim(),
      time_of_day: m.querySelector('#rTime').value
    });
    await selectElder(current.id);
    toast('Đã thêm nhắc nhở');
  };
}

async function toggleReminder(id, active) {
  await api.put(`/elders/${current.id}/reminders/${id}`, { active });
  await selectElder(current.id);
}

async function delReminder(id) {
  await api.del(`/elders/${current.id}/reminders/${id}`);
  await selectElder(current.id);
  toast('Đã xoá nhắc nhở');
}

/* ===================== THÊM / SỬA NGƯỜI THÂN ===================== */

function openElderForm(elder = null) {
  const e = elder || {};
  const m = openModal(`
    <h3>${elder ? 'Sửa thông tin' : 'Thêm người thân'}</h3>
    <p class="modal-sub">Thông tin cơ bản để chăm sóc viên biết cần đến đâu và chăm sóc ai.</p>
    <div class="field"><label>Họ và tên</label><input type="text" id="fName" value="${esc(e.full_name) || ''}" placeholder="Nguyễn Văn Bảy"></div>
    <div class="field-row">
      <div class="field"><label>Năm sinh</label><input type="number" id="fYear" value="${e.birth_year || ''}" placeholder="1946"></div>
      <div class="field"><label>Giới tính</label>
        <select id="fGender">
          <option value="">Chưa chọn</option>
          <option value="nam" ${e.gender === 'nam' ? 'selected' : ''}>Nam</option>
          <option value="nu" ${e.gender === 'nu' ? 'selected' : ''}>Nữ</option>
          <option value="khac" ${e.gender === 'khac' ? 'selected' : ''}>Khác</option>
        </select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Quan hệ với bạn</label><input type="text" id="fRelation" value="${esc(e.relation) || ''}" placeholder="Bố / Mẹ / Ông / Bà"></div>
      <div class="field"><label>Số điện thoại</label><input type="tel" id="fPhone" value="${esc(e.phone) || ''}" placeholder="0903000001"></div>
    </div>
    <div class="field"><label>Địa chỉ chăm sóc</label><input type="text" id="fAddr" value="${esc(e.address) || ''}" placeholder="Số nhà, đường, quận, thành phố"></div>
    ${elder ? '' : `
    <div class="field" style="background:var(--teal-soft); padding:16px; border-radius:var(--radius)">
      <label style="display:flex; align-items:center; gap:10px; cursor:pointer">
        <input type="checkbox" id="fAccount" style="width:18px; height:18px; accent-color:var(--teal-deep)">
        <span>Tạo tài khoản riêng cho người cao tuổi</span>
      </label>
      <div class="hint">Dùng số điện thoại ở trên để đăng nhập vào màn hình chữ to, có nhắc uống thuốc và nghe radio.</div>
      <div id="pwBox" class="hidden" style="margin-top:12px">
        <input type="password" id="fPw" placeholder="Mật khẩu cho tài khoản này (ít nhất 6 ký tự)">
      </div>
    </div>`}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">${elder ? 'Lưu thay đổi' : 'Thêm người thân'}</button>
    </div>`);

  const chk = m.querySelector('#fAccount');
  chk?.addEventListener('change', () => m.querySelector('#pwBox').classList.toggle('hidden', !chk.checked));

  m.querySelector('#ok').onclick = async () => {
    const body = {
      full_name: m.querySelector('#fName').value.trim(),
      birth_year: Number(m.querySelector('#fYear').value) || null,
      gender: m.querySelector('#fGender').value || null,
      relation: m.querySelector('#fRelation').value.trim() || null,
      phone: m.querySelector('#fPhone').value.trim() || null,
      address: m.querySelector('#fAddr').value.trim() || null
    };
    if (!body.full_name) return toast('Cần nhập họ tên');

    if (!elder && chk?.checked) {
      const pw = m.querySelector('#fPw').value;
      if (!body.phone || pw.length < 6) return toast('Cần số điện thoại và mật khẩu ít nhất 6 ký tự');
      body.create_account = true;
      body.account_password = pw;
    }

    try {
      if (elder) await api.put(`/elders/${elder.id}`, body);
      else await api.post('/elders', body);
      m.close();
      await loadElders();
      toast(elder ? 'Đã lưu thay đổi' : 'Đã thêm người thân');
    } catch (err) { toast(err.message); }
  };
}

document.getElementById('addElderBtn').addEventListener('click', () => openElderForm());
if (params.get('new')) openElderForm();
loadElders().catch(e => toast(e.message));
</script>
</body>
</html>
