<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — An Lão</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<style>
  body{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px 20px;}
  .auth-box{width:100%; max-width:470px;}
  .auth-brand{display:flex; align-items:center; justify-content:center; gap:11px; margin-bottom:28px;}
  .auth-brand img{width:40px; height:40px;}
  .auth-brand span{font-family:'Fraunces', serif; font-size:26px; font-weight:600;}
  .auth-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px; box-shadow:var(--shadow);}
  .auth-card h1{font-size:25px; margin-bottom:6px;}
  .auth-card .lead{color:var(--ink-soft); font-size:14.5px; margin-bottom:26px;}
  .auth-foot{text-align:center; margin-top:22px; font-size:14.5px; color:var(--ink-soft);}
  .auth-foot a{color:var(--blue-deep); font-weight:600;}
  .role-pick{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;}
  .role-opt{
    padding:16px; border:1.5px solid var(--line); border-radius:var(--radius);
    cursor:pointer; text-align:center; background:var(--paper); transition:border-color .15s, background .15s;
  }
  .role-opt .t{font-weight:600; font-size:15px;}
  .role-opt .d{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .role-opt.on{border-color:var(--blue); background:var(--blue-soft);}
</style>
</head>
<body>
<div class="auth-box">
  <a href="/" class="auth-brand"><img src="/assets/logo.png" alt=""><span>An Lão</span></a>
  <div class="auth-card">
    <h1>Tạo tài khoản</h1>
    <p class="lead">Chọn vai trò phù hợp với bạn để bắt đầu.</p>

    <div class="role-pick">
      <div class="role-opt on" data-role="family">
        <div class="t">Gia đình</div>
        <div class="d">Tìm người chăm sóc cho người thân</div>
      </div>
      <div class="role-opt" data-role="caregiver">
        <div class="t">Chăm sóc viên</div>
        <div class="d">Nhận ca làm phù hợp lịch của bạn</div>
      </div>
    </div>

    <div id="msg"></div>
    <div class="field">
      <label for="full_name">Họ và tên</label>
      <input type="text" id="full_name" placeholder="Nguyễn Văn An">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ban@email.com">
      </div>
      <div class="field">
        <label for="phone">Số điện thoại</label>
        <input type="tel" id="phone" placeholder="0901234567">
      </div>
    </div>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" placeholder="Ít nhất 6 ký tự">
      <div class="hint">Cần điền ít nhất một trong hai: email hoặc số điện thoại.</div>
    </div>
    <button class="btn btn-primary btn-block" id="submitBtn">Tạo tài khoản</button>
  </div>
  <p class="auth-foot">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
</div>

<script src="/js/api.js"></script>
<script>
  if (Auth.token && Auth.user) location.href = Auth.homeFor(Auth.user.role);

  let role = new URLSearchParams(location.search).get('role') || 'family';
  const opts = document.querySelectorAll('.role-opt');
  const paint = () => opts.forEach(o => o.classList.toggle('on', o.dataset.role === role));
  opts.forEach(o => o.addEventListener('click', () => { role = o.dataset.role; paint(); }));
  paint();

  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  btn.addEventListener('click', async () => {
    const body = {
      role,
      full_name: document.getElementById('full_name').value.trim(),
      email: document.getElementById('email').value.trim() || undefined,
      phone: document.getElementById('phone').value.trim() || undefined,
      password: document.getElementById('password').value
    };
    if (!body.full_name || !body.password || (!body.email && !body.phone)) {
      msg.innerHTML = '<div class="alert alert-error">Cần họ tên, mật khẩu và email hoặc số điện thoại</div>';
      return;
    }
    btn.disabled = true; btn.textContent = 'Đang tạo…';
    try {
      const data = await api.post('/auth/register', body);
      Auth.save(data.token, data.user);
      location.href = Auth.homeFor(data.user.role);
    } catch (e) {
      msg.innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
      btn.disabled = false; btn.textContent = 'Tạo tài khoản';
    }
  });
</script>
</body>
</html>
