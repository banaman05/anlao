<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tổng quan — An Lão</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="greeting">Tổng quan</h1>
        <div class="sub" id="today"></div>
      </div>
      <a href="/app/family/booking.html?new=1" class="btn btn-primary btn-sm">Đặt ca chăm sóc</a>
    </div>

    <div class="content stack">
      <div class="grid-4" id="stats"></div>

      <!-- Ca đang diễn ra -->
      <div id="liveSection"></div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head">
            <h3>Ca sắp tới</h3>
            <a href="/app/family/booking.html" class="faint">Xem tất cả</a>
          </div>
          <div id="upcoming"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <h3>Chỉ số sức khoẻ gần đây</h3>
            <a href="/app/family/elders.html" class="faint">Hồ sơ đầy đủ</a>
          </div>
          <div id="vitals"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Người thân đang được chăm sóc</h3></div>
        <div class="grid-3" id="elders"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
const user = Auth.guard('family');
mountNav('home');

document.getElementById('greeting').textContent =
  `Chào ${user.full_name.split(' ').slice(-1)[0]}`;
document.getElementById('today').textContent =
  new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

(async function load() {
  const [bookings, elders, paySummary] = await Promise.all([
    api.get('/bookings'),
    api.get('/elders'),
    api.get('/payments/summary')
  ]);

  /* ---------- ô số liệu ---------- */
  const upcoming = bookings.filter(b => ['confirmed', 'pending'].includes(b.status));
  const done = bookings.filter(b => b.status === 'completed');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="lbl">Ca sắp tới</div><div class="val">${upcoming.length}</div>
      <div class="note">${bookings.filter(b => b.status === 'pending').length} ca đang chờ nhận</div></div>
    <div class="stat"><div class="lbl">Ca đã hoàn thành</div><div class="val teal">${done.length}</div>
      <div class="note">Tổng từ trước tới nay</div></div>
    <div class="stat"><div class="lbl">Chi tháng này</div><div class="val">${fmtMoney(paySummary.month_paid)}</div>
      <div class="note">Đã thanh toán</div></div>
    <div class="stat"><div class="lbl">Chờ thanh toán</div><div class="val amber">${fmtMoney(paySummary.pending_amount)}</div>
      <div class="note">${paySummary.pending_count} khoản</div></div>
  `;

  /* ---------- ca đang diễn ra ---------- */
  const live = bookings.find(b => b.status === 'in_progress');
  document.getElementById('liveSection').innerHTML = live ? `
    <div class="card" style="border-color:var(--teal); background:var(--teal-soft)">
      <div class="row-between">
        <div class="row">
          ${avatar(live.caregiver_name || '?', live.caregiver_color || '#3FBFAE')}
          <div>
            <div style="font-weight:600">Đang chăm sóc ${esc(live.elder_name)}</div>
            <div class="muted" style="font-size:14px">
              ${esc(live.caregiver_name || 'Chưa có người')} ·
              ${fmtTime(live.start_at)} – ${fmtTime(live.end_at)} ·
              đã xong ${live.task_done}/${live.task_total} việc
            </div>
          </div>
        </div>
        <a href="/app/family/booking-detail.html?id=${live.id}" class="btn btn-teal btn-sm">Theo dõi trực tiếp</a>
      </div>
    </div>` : '';

  /* ---------- ca sắp tới ---------- */
  const next = upcoming.slice().sort((a, b) => new Date(a.start_at) - new Date(b.start_at)).slice(0, 4);
  document.getElementById('upcoming').innerHTML = next.length ? next.map(b => {
    const d = new Date(b.start_at.replace(' ', 'T'));
    return `
    <a href="/app/family/booking-detail.html?id=${b.id}" class="booking" style="margin-bottom:10px">
      <div class="when">
        <div class="d">${d.getDate()}</div>
        <div class="m">Th ${d.getMonth() + 1}</div>
      </div>
      <div>
        <div class="ttl">${esc(b.elder_name)} · ${esc(b.package_name || MODE_LABEL[b.mode])}</div>
        <div class="meta">${fmtTime(b.start_at)} – ${fmtTime(b.end_at)} ·
          ${b.caregiver_name ? esc(b.caregiver_name) : 'Chưa có chăm sóc viên'}</div>
      </div>
      <div class="side">${statusBadge(b.status)}<div class="amt">${fmtMoney(b.total_amount)}</div></div>
    </a>`;
  }).join('') : `<div class="empty"><strong>Chưa có ca nào sắp tới</strong>
      Đặt ca chăm sóc để bắt đầu.</div>`;

  /* ---------- chỉ số sức khoẻ ---------- */
  const vitalsBox = document.getElementById('vitals');
  if (!elders.length) {
    vitalsBox.innerHTML = `<div class="empty"><strong>Chưa có hồ sơ</strong>Thêm người thân để theo dõi sức khoẻ.</div>`;
  } else {
    const vitals = await api.get(`/elders/${elders[0].id}/vitals?limit=5`);
    vitalsBox.innerHTML = vitals.length ? `
      <div class="faint" style="margin-bottom:12px">${esc(elders[0].full_name)}</div>
      <table>
        <tr><th>Thời gian</th><th>Huyết áp</th><th>Nhịp tim</th><th>Giấc ngủ</th></tr>
        ${vitals.map(v => `
          <tr>
            <td class="muted">${fmtRelative(v.recorded_at)}</td>
            <td class="mono-num">${v.systolic && v.diastolic ? `${v.systolic}/${v.diastolic}` : '—'}</td>
            <td class="mono-num">${v.heart_rate || '—'}</td>
            <td class="mono-num">${v.sleep_hours ? v.sleep_hours + ' giờ' : '—'}</td>
          </tr>`).join('')}
      </table>` :
      `<div class="empty"><strong>Chưa có số liệu</strong>Chỉ số sẽ xuất hiện sau ca chăm sóc đầu tiên.</div>`;
  }

  /* ---------- danh sách người thân ---------- */
  document.getElementById('elders').innerHTML = elders.length ? elders.map(e => `
    <a href="/app/family/elders.html?id=${e.id}" class="cg-card">
      <div class="cg-head">
        ${avatar(e.full_name, '#E2A045')}
        <div>
          <div class="cg-name">${esc(e.full_name)}</div>
          <div class="cg-sub">${e.birth_year ? (new Date().getFullYear() - e.birth_year) + ' tuổi' : ''}
            ${e.relation ? ' · ' + esc(e.relation) : ''}</div>
        </div>
      </div>
      <div class="faint">${e.booking_count} ca chăm sóc đã đặt</div>
    </a>`).join('') + `
    <a href="/app/family/elders.html?new=1" class="cg-card" style="border-style:dashed; justify-content:center; align-items:center; text-align:center; color:var(--ink-soft)">
      <div style="font-size:24px">+</div>
      <div style="font-size:14.5px">Thêm người thân</div>
    </a>` :
    `<div class="empty" style="grid-column:1/-1"><strong>Chưa có hồ sơ người thân</strong>
      Thêm hồ sơ để bắt đầu đặt ca chăm sóc.
      <div style="margin-top:16px"><a href="/app/family/elders.html?new=1" class="btn btn-primary btn-sm">Thêm người thân</a></div></div>`;
})().catch(e => toast(e.message));
</script>
</body>
</html>
