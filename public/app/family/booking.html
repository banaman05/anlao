<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ca chăm sóc — An Lão</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  .pkg-pick{display:grid; gap:10px; margin-bottom:6px;}
  .pkg-opt{
    border:1.5px solid var(--line); border-radius:var(--radius); padding:15px 17px; cursor:pointer;
    display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; background:var(--paper);
  }
  .pkg-opt.on{border-color:var(--blue); background:var(--blue-soft);}
  .pkg-opt .nm{font-weight:600; font-size:15px;}
  .pkg-opt .ds{font-size:13px; color:var(--ink-soft); margin-top:3px;}
  .pkg-opt .pr{font-family:'Fraunces', serif; font-size:17px; color:var(--blue-deep); white-space:nowrap;}
  .quote-box{
    background:var(--teal-soft); border-radius:var(--radius); padding:18px 20px; margin-top:6px;
  }
  .quote-box .tot{font-family:'Fraunces', serif; font-size:28px; color:var(--teal-deep); line-height:1.2;}
  .pay-pick{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .pay-opt{
    border:1.5px solid var(--line); border-radius:var(--radius); padding:12px; text-align:center;
    cursor:pointer; font-size:14px; font-weight:500; background:var(--paper);
  }
  .pay-opt.on{border-color:var(--teal-deep); background:var(--teal-soft); color:var(--teal-deep);}
  @media (max-width:640px){ .pay-pick{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1>Ca chăm sóc</h1>
        <div class="sub">Đặt lịch mới và theo dõi toàn bộ ca đã đặt</div>
      </div>
      <button class="btn btn-primary btn-sm" id="newBtn">Đặt ca mới</button>
    </div>

    <div class="content">
      <div class="tabs" id="tabs">
        <button class="tab active" data-f="all">Tất cả</button>
        <button class="tab" data-f="pending">Chờ nhận</button>
        <button class="tab" data-f="confirmed">Đã xác nhận</button>
        <button class="tab" data-f="in_progress">Đang chăm sóc</button>
        <button class="tab" data-f="completed">Hoàn thành</button>
      </div>
      <div id="list"></div>
    </div>
  </main>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
Auth.guard('family');
mountNav('booking');

let bookings = [], filter = 'all';
const params = new URLSearchParams(location.search);

/* ===================== DANH SÁCH CA ===================== */

async function loadBookings() {
  bookings = await api.get('/bookings');
  paint();
}

function paint() {
  const rows = filter === 'all' ? bookings : bookings.filter(b => b.status === filter);
  document.getElementById('list').innerHTML = rows.length ? rows.map(b => {
    const d = new Date(b.start_at.replace(' ', 'T'));
    const progress = b.task_total ? Math.round(b.task_done / b.task_total * 100) : 0;
    return `
    <a href="/app/family/booking-detail.html?id=${b.id}" class="booking">
      <div class="when">
        <div class="d">${d.getDate()}</div>
        <div class="m">Th ${d.getMonth() + 1}</div>
      </div>
      <div>
        <div class="ttl">${esc(b.elder_name)} · ${esc(b.package_name || MODE_LABEL[b.mode])}</div>
        <div class="meta">
          ${fmtTime(b.start_at)} – ${fmtTime(b.end_at)} ·
          ${b.caregiver_name ? esc(b.caregiver_name) : '<span style="color:var(--amber)">Chưa có chăm sóc viên</span>'} ·
          mã ${esc(b.code)}
        </div>
        ${['in_progress', 'completed'].includes(b.status) && b.task_total ? `
          <div style="margin-top:9px; max-width:260px">
            <div class="bar"><span style="width:${progress}%"></span></div>
            <div class="faint" style="margin-top:4px">${b.task_done}/${b.task_total} đầu việc</div>
          </div>` : ''}
      </div>
      <div class="side">
        ${statusBadge(b.status)}
        <div class="amt">${fmtMoney(b.total_amount)}</div>
        <div class="faint">${PAY_LABEL[b.payment_status] || ''}</div>
      </div>
    </a>`;
  }).join('') : `<div class="empty"><strong>Chưa có ca nào</strong>
    Đặt ca chăm sóc đầu tiên để bắt đầu.
    <div style="margin-top:16px"><button class="btn btn-primary btn-sm" onclick="openBookingForm()">Đặt ca mới</button></div></div>`;
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  filter = t.dataset.f;
  paint();
}));

/* ===================== ĐẶT CA MỚI ===================== */

async function openBookingForm() {
  const [elders, packages] = await Promise.all([api.get('/elders'), api.get('/packages')]);

  if (!elders.length) {
    return openModal(`
      <h3>Cần hồ sơ người thân trước</h3>
      <p class="modal-sub">Thêm hồ sơ để chăm sóc viên biết cần chăm sóc ai và lưu ý những gì.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Để sau</button>
        <a href="/app/family/elders.html?new=1" class="btn btn-primary">Thêm người thân</a>
      </div>`);
  }

  // Mặc định: ca sáng ngày mai
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1); tmr.setHours(8, 0, 0, 0);
  const localISO = (d) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);

  const preElder = Number(params.get('elder')) || elders[0].id;
  let pkgId = packages[0].id;
  let payMethod = 'cash';

  const m = openModal(`
    <h3>Đặt ca chăm sóc</h3>
    <p class="modal-sub">Chi phí hiển thị đầy đủ trước khi bạn xác nhận.</p>

    <div class="field"><label>Chăm sóc cho</label>
      <select id="bElder">${elders.map(e =>
        `<option value="${e.id}" ${e.id === preElder ? 'selected' : ''}>${esc(e.full_name)}${e.relation ? ' (' + esc(e.relation) + ')' : ''}</option>`).join('')}</select></div>

    <div class="field"><label>Gói dịch vụ</label>
      <div class="pkg-pick" id="pkgPick">${packages.map(p => `
        <div class="pkg-opt ${p.id === pkgId ? 'on' : ''}" data-id="${p.id}">
          <div>
            <div class="nm">${esc(p.name)}</div>
            <div class="ds">${esc(p.details.slice(0, 95))}${p.details.length > 95 ? '…' : ''}</div>
          </div>
          <div class="pr">${fmtMoney(p.price_shift)}</div>
        </div>`).join('')}</div></div>

    <div class="field"><label>Hình thức đặt</label>
      <select id="bMode">
        <option value="shift">Theo ca</option>
        <option value="hourly">Theo giờ</option>
        <option value="monthly">Gói tháng</option>
        <option value="procedure">Thủ thuật lẻ</option>
      </select></div>

    <div class="field-row">
      <div class="field"><label>Bắt đầu</label><input type="datetime-local" id="bStart" value="${localISO(tmr)}"></div>
      <div class="field"><label>Kết thúc</label><input type="datetime-local" id="bEnd" value="${localISO(new Date(tmr.getTime() + 4 * 36e5))}"></div>
    </div>

    <div class="field"><label>Ghi chú cho chăm sóc viên</label>
      <textarea id="bNote" placeholder="Ví dụ: bố cần hỗ trợ tập tay trái sau tai biến"></textarea></div>

    <div class="field"><label>Phương thức thanh toán</label>
      <div class="pay-pick" id="payPick">
        <div class="pay-opt on" data-m="cash">Tiền mặt</div>
        <div class="pay-opt" data-m="card">Thẻ tín dụng</div>
        <div class="pay-opt" data-m="transfer">Chuyển khoản</div>
      </div></div>

    <div class="quote-box" id="quote"><div class="muted">Đang tính chi phí…</div></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').close()">Huỷ</button>
      <button class="btn btn-primary" id="ok">Xác nhận đặt ca</button>
    </div>`);

  // Chọn gói
  m.querySelectorAll('.pkg-opt').forEach(o => o.addEventListener('click', () => {
    m.querySelectorAll('.pkg-opt').forEach(x => x.classList.remove('on'));
    o.classList.add('on');
    pkgId = Number(o.dataset.id);
    refreshQuote();
  }));

  // Chọn cách trả tiền
  m.querySelectorAll('.pay-opt').forEach(o => o.addEventListener('click', () => {
    m.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('on'));
    o.classList.add('on');
    payMethod = o.dataset.m;
  }));

  ['bMode', 'bStart', 'bEnd'].forEach(id =>
    m.querySelector('#' + id).addEventListener('change', refreshQuote));

  async function refreshQuote() {
    const box = m.querySelector('#quote');
    try {
      const q = await api.post('/packages/quote', {
        package_id: pkgId,
        mode: m.querySelector('#bMode').value,
        start_at: m.querySelector('#bStart').value,
        end_at: m.querySelector('#bEnd').value
      });
      box.innerHTML = `
        <div class="faint">Tổng chi phí dự kiến</div>
        <div class="tot">${fmtMoney(q.total)}</div>
        <div style="font-size:13.5px; color:var(--teal-deep); margin-top:5px">${esc(q.breakdown)}</div>
        ${q.price_note ? `<div class="faint" style="margin-top:8px">${esc(q.price_note)}</div>` : ''}`;
    } catch (e) {
      box.innerHTML = `<div style="color:var(--danger); font-size:14px">${esc(e.message)}</div>`;
    }
  }
  refreshQuote();

  m.querySelector('#ok').onclick = async () => {
    const body = {
      elder_id: Number(m.querySelector('#bElder').value),
      package_id: pkgId,
      mode: m.querySelector('#bMode').value,
      start_at: m.querySelector('#bStart').value.replace('T', ' '),
      end_at: m.querySelector('#bEnd').value.replace('T', ' '),
      note: m.querySelector('#bNote').value.trim() || null,
      payment_method: payMethod
    };
    try {
      const b = await api.post('/bookings', body);
      m.close();
      toast('Đã đặt ca. Chăm sóc viên phù hợp sẽ nhận ca sớm.');
      location.href = `/app/family/booking-detail.html?id=${b.id}`;
    } catch (e) { toast(e.message); }
  };
}

document.getElementById('newBtn').addEventListener('click', () => openBookingForm());
if (params.get('new')) openBookingForm();
loadBookings().catch(e => toast(e.message));
</script>
</body>
</html>
